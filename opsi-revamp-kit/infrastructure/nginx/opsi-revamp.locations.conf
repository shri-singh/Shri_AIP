# NGINX locations for the REVAMP environment. Include inside the revamp server{} block:
#     include /etc/nginx/snippets/opsi-revamp.locations.conf;
# Do NOT add this to the production Opsi server block until the change is approved (master prompt:
# no changes to production NGINX routing). Test with `sudo nginx -t` before `sudo systemctl reload nginx`.
#
# Rate limiting needs a zone in the http{} block (e.g. /etc/nginx/conf.d/opsi-revamp-zones.conf):
#     limit_req_zone $binary_remote_addr zone=opsi_copilot:10m rate=30r/m;
#     limit_req_zone $binary_remote_addr zone=opsi_api_v2:10m rate=20r/s;

# --- CopilotKit V2 runtime (Node, 127.0.0.1:4000). Streams Server-Sent Events: buffering MUST be off.
location /api/copilotkit/ {
    limit_req zone=opsi_copilot burst=10 nodelay;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;   # long agent runs; the runtime sends keep-alive comments every 15 s
    proxy_send_timeout 300s;
    client_max_body_size 2m;
    add_header Cache-Control "no-store" always;
}

# --- The AG-UI agent endpoint is internal only: runtime -> FastAPI over loopback. Never public.
location /api/v2/agents/ {
    return 404;
}

# --- Revamp REST APIs on the existing FastAPI app (adjust the upstream to Opsi's API address).
location /api/v2/ {
    limit_req zone=opsi_api_v2 burst=40 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;   # attachments go browser -> S3 directly, never through NGINX
}

location = /api/v2/voice/transcribe {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 6m;
    proxy_read_timeout 90s;
}

# Health endpoints should not be public; expose them only to the load balancer/monitoring subnet.
location = /api/v2/healthz {
    allow 127.0.0.1;
    # allow 10.0.0.0/8;   # monitoring subnet
    deny all;
    proxy_pass http://127.0.0.1:8000;
}
