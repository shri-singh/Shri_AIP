# Copy to .github/dependabot.yml in opsi-enterprise-revamp.
# On GitHub Enterprise Server, Dependabot needs to be enabled by the site admin (GitHub Connect + Actions runners);
# if it is not available, use Renovate (self-hosted) with the same grouping, or the monthly manual review in
# docs/repository-strategy.md section 9.
# Fast-moving vendors (CopilotKit, AG-UI) are grouped so they always move together and are verified by
# apps/*/scripts/verify-*.mjs in CI before merge (ADR-0017).
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/opsi-web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      copilotkit:
        patterns: ["@copilotkit/*", "@ag-ui/*"]
      ui-libs:
        patterns: ["echarts*", "@xyflow/*", "@rjsf/*"]
    labels: [dependencies, frontend]

  - package-ecosystem: npm
    directory: /apps/copilot-runtime
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      copilotkit:
        patterns: ["@copilotkit/*", "@ag-ui/*"]
    labels: [dependencies, runtime]

  - package-ecosystem: pip
    directory: /requirements
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies, python]

  - package-ecosystem: docker
    directory: /apps/copilot-runtime
    schedule: { interval: monthly }
    labels: [dependencies, containers]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies, ci]
