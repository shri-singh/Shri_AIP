# Copy to .github/workflows/ci.yml in opsi-enterprise-revamp and mark every job as a REQUIRED status check
# in branch protection for main. Pin each action to a full commit SHA if your org policy requires it
# (Dependabot's github-actions ecosystem keeps those pins current).
# Paths assume the product repo carries scripts/repo/*, scripts/secret_scan.py and scripts/license_scan.sh from the kit.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  SCARF_ANALYTICS: "false"
  COPILOTKIT_TELEMETRY_DISABLED: "true"
  DO_NOT_TRACK: "1"

jobs:
  repo-policy:
    name: repo policy (hygiene, vendored code, secrets)
    runs-on: [self-hosted, linux]          # or ubuntu-latest on github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: repository hygiene (no submodules, stray licences, junk, unlocked package.json)
        run: python3 scripts/repo/repo_hygiene.py --repo-root .
      - name: vendored code matches VENDORED.json (hashes, licences, recorded modifications)
        run: |
          if [ -f third_party/VENDORED.json ]; then python3 scripts/repo/vendor_component.py verify; fi
      - name: THIRD_PARTY_NOTICES.md is up to date
        run: |
          if [ -f third_party/VENDORED.json ]; then
            python3 scripts/repo/vendor_component.py notices --out /tmp/notices.md
            diff -u THIRD_PARTY_NOTICES.md /tmp/notices.md
          fi
      - name: secret scan
        run: python3 scripts/secret_scan.py

  python:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install -r requirements/dev.txt
      - run: python3 -m ruff check .
      - run: python3 -m pytest -q

  web:
    runs-on: [self-hosted, linux]
    defaults: { run: { working-directory: apps/opsi-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/opsi-web/package-lock.json }
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: node scripts/verify-copilotkit-v2.mjs src

  runtime:
    runs-on: [self-hosted, linux]
    defaults: { run: { working-directory: apps/copilot-runtime } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/copilot-runtime/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run check:exports

  licences:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python3 -m pip install -r requirements/dev.txt
      - run: PYTHON=python3 scripts/license_scan.sh
      - uses: actions/upload-artifact@v4
        with: { name: licence-reports, path: reports/, retention-days: 30 }
