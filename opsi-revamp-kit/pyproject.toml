[project]
name = "opsi-revamp-kit"
version = "0.3.0"
description = "Reference implementation + docs for the Opsi 3.0 enterprise revamp (overlay kit, not a deployable app)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["services/ingestion", "apps/opsi-api", "tools/kb"]
testpaths = ["tests"]
markers = [
  "integration: needs real services (TEST_DATABASE_URL etc.); skipped by default",
]
addopts = "-ra -m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["apps/opsi-web", "apps/copilot-runtime", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S101", "S311", "UP007", "UP017", "B008", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "B017", "S603", "S607"]
"scripts/**" = ["S603", "S607"]
